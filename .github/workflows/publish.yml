# Builds the blog with the newest cowtent-core and publishes it on GitHub
# Pages: after every commit, every Monday (to pick up cowtent-core updates
# without writing anything), and from the Actions tab (Run workflow).
name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # pnpm's version is packageManager in package.json, Node's .node-version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - id: pages
        uses: actions/configure-pages@v5
      # No lockfile, and pnpm build updates cowtent-core first: every build
      # gets the newest one from its main branch
      - run: pnpm install
      # The address of the site (site.yaml's url: wins when there is one):
      # for the RSS feed, the links that get shared, and the path the site
      # is under, like /cowtent-starter/. The build checks its own result.
      - run: pnpm build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
